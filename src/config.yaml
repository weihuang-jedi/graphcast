# config.yaml
stage: "STANDARD"
in_channels: 15
out_channels: 6
num_levels: 32
num_nodes: 40962
latent_dim: 256
processor_layers: 16

mesh:
  num_nodes: 40962
  num_levels: 32

paths:
  zarr_store: "/scratch5/purged/Wei.Huang/src/starviewerweathermodel/data/icosahedral_logstate.zarr"
  data_dir: "/scratch5/purged/Wei.Huang/src/starviewerweathermodel/data/icosahedral_logstate.zarr"
  graph_dir: "/scratch5/purged/Wei.Huang/src/starviewerweathermodel/graph/graph-grid"
  grid_ref: "/scratch5/purged/Wei.Huang/src/starviewerweathermodel/data/icosahedral-grid/icosahedral_logstate_m6.20240101.t00z.0p25.f000.nc"

model_params:
  hierarchy_levels: [6, 5, 4, 3, 2, 1, 0]
  num_nodes: 40962
  num_levels: 32
  in_channels: 15
  out_channels: 6
  history_steps: 2
  rollout_steps: 2          # Increased from 2 to 4 steps (24h backprop unrolling)
  latent_dim: 256
  processor_layers: 16
  learning_rate: 1.0e-04

training_params:
  batch_size: 1
  accumulate_grad_batches: 4
  max_epochs: 6
  num_workers: 4
  gradient_clip_val: 0.5
  precision: "bf16-mixed"

loss_weights:
  weight_P: 5.0
  weight_Q: 1.0
  weight_T: 1.0
  weight_U: 6.0              # Priority on zonal momentum retention
  weight_V: 10.0             # Priority on meridional wave stability
  weight_W: 1.0

  # Base State Regularizers
  lambda_moisture: 10.0
  weight_mass_drift: 10.0
  weight_variance: 2.0
  weight_v_spatial: 2.0
  weight_v_phase: 1.0

  # 3D Navier-Stokes & Kinetic Energy Extensions
  weight_wind_ke: 0.5         # Kinetic energy loss penalty
  weight_wind_dir: 0.5        # Wind direction cosine similarity penalty
  weight_momentum_h: 0.02     # 3D Horizontal momentum residual loss weight
  weight_momentum_v: 0.002    # Non-hydrostatic vertical momentum residual loss weight
  weight_continuity: 0.01     # 3D Mass continuity residual loss weight
